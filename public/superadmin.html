<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Superadmin Console</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Attendance">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  @media (max-width: 1023px) {
    .desktop-only { display: none !important; }
    .mobile-only { display: flex !important; }
    #appContainer { max-width: 28rem !important; height: 100dvh !important; border-radius: 0 !important; border: none !important; }
  }
  @media (min-width: 1024px) {
    .desktop-only { display: flex !important; }
    .mobile-only { display: none !important; }
    #appContainer { max-width: 90rem !important; height: 94vh !important; border-radius: 1rem !important; }
  }

    /* ===== iOS/Android Safe Area + Tap Targets ===== */
    @supports (padding-top: env(safe-area-inset-top)) {
      @media (max-width: 1023px) {
        #appContainer {
          padding-top: env(safe-area-inset-top) !important;
          padding-bottom: env(safe-area-inset-bottom) !important;
          padding-left: env(safe-area-inset-left) !important;
          padding-right: env(safe-area-inset-right) !important;
          box-sizing: border-box !important;
        }
        header.mobile-only {
          min-height: 60px;
        }
        header.mobile-only button {
          min-width: 44px;
          min-height: 44px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          touch-action: manipulation;
        }
        footer.mobile-only button {
          min-height: 48px;
          touch-action: manipulation;
        }
      }
    }
    /* Full-screen pages (index, signup) */
    @supports (padding-top: env(safe-area-inset-top)) {
      @media (max-width: 1023px) {
        body {
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
          box-sizing: border-box;
        }
      }
    }
</style>
</head>
<body class="bg-gray-900 flex justify-center items-center min-h-[100dvh] p-0 lg:p-6 select-none">

<div id="appContainer" class="w-full bg-white shadow-2xl flex flex-col lg:flex-row overflow-hidden relative mx-auto">

  <!-- LOGIN VIEW -->
  <div id="loginView" class="p-6 lg:p-12 flex flex-col justify-center items-center h-full w-full bg-white z-50 absolute inset-0">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center text-white text-3xl shadow-lg mx-auto mb-4">
          <i class="fas fa-crown"></i>
        </div>
        <h1 class="text-2xl lg:text-3xl font-bold text-gray-800 tracking-tight">Superadmin Console</h1>
        <p class="text-gray-500 text-xs lg:text-sm mt-1">Multi-tenant control center</p>
      </div>

      <form onsubmit="event.preventDefault(); superadminLogin();" class="flex flex-col space-y-4">
        <div>
          <label class="text-[11px] font-bold text-gray-500 uppercase block mb-1">Superadmin Email</label>
          <input type="text" id="saEmail" placeholder="super@admin.com" class="w-full p-3.5 border rounded-xl bg-gray-50 text-sm outline-none focus:bg-white focus:border-indigo-500 transition" required>
        </div>
        <div>
          <label class="text-[11px] font-bold text-gray-500 uppercase block mb-1">Password</label>
          <input type="password" id="saPassword" placeholder="••••••••" class="w-full p-3.5 border rounded-xl bg-gray-50 text-sm outline-none focus:bg-white focus:border-indigo-500 transition" required>
        </div>

        <button type="submit" id="btnLogin" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-xl font-bold shadow-lg active:scale-95 transition flex items-center justify-center gap-2 mt-2">
          <span>Access Console</span>
          <i class="fas fa-arrow-right text-xs"></i>
        </button>
      </form>

      <p id="loginError" class="text-red-500 text-xs text-center mt-3 hidden"></p>
    </div>
  </div>

  <!-- SIDEBAR -->
  <aside id="desktopSidebar" class="desktop-only flex-col w-64 bg-slate-900 text-slate-300 flex-shrink-0 z-30 justify-between">
    <div>
      <div class="p-5 border-b border-slate-800 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-lg"><i class="fas fa-network-wired"></i></div>
        <div class="overflow-hidden">
          <h2 class="text-sm font-bold text-white truncate">Superadmin HQ</h2>
          <p class="text-[10px] text-indigo-400 flex items-center gap-1 mt-0.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Multi-Tenant
          </p>
        </div>
      </div>
      <nav class="p-3 space-y-1">
        <div class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold bg-indigo-600 text-white">
          <i class="fas fa-city w-5 text-center"></i> Firm Registry
        </div>
      </nav>
    </div>
    <div class="p-4 border-t border-slate-800">
      <div class="flex items-center justify-between">
        <span id="saUserLabel" class="text-xs font-semibold truncate">Superadmin</span>
        <button onclick="logout()" class="text-slate-400 hover:text-red-400 p-2"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div id="dashboardView" class="hidden flex-1 flex-col h-full overflow-hidden w-full relative">

    <!-- MOBILE HEADER -->
    <header class="mobile-only bg-indigo-700 p-4 text-white justify-between items-center shadow-md z-20 flex-shrink-0">
      <div class="flex items-center gap-2.5">
        <i class="fas fa-crown opacity-80"></i>
        <h1 class="font-bold text-base">Superadmin</h1>
      </div>
      <button onclick="logout()" class="bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded-lg text-xs font-semibold">
        <i class="fas fa-sign-out-alt mr-1"></i> Logout
      </button>
    </header>

    <!-- DESKTOP HEADER -->
    <header class="desktop-only bg-white border-b px-6 py-4 justify-between items-center z-20 flex-shrink-0">
      <div class="flex items-center gap-3">
        <span class="text-sm font-bold text-gray-800">Firm Provisioning</span>
        <span class="text-gray-300">|</span>
        <span id="firmCountBadge" class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full border border-indigo-100">0 Firms</span>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="loadFirms()" class="text-xs font-semibold text-gray-600 hover:text-indigo-600 bg-gray-100 px-3 py-1.5 rounded-lg border">
          <i class="fas fa-sync-alt" id="refreshIcon"></i> Refresh
        </button>
      </div>
    </header>

    <!-- WORKSPACE -->
    <main class="flex-1 overflow-y-auto bg-gray-100 p-3.5 lg:p-6">
      <div class="flex flex-col lg:flex-row gap-5 items-start">

        <!-- CREATE FIRM -->
        <div class="w-full lg:w-96 flex-shrink-0">
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
            <div class="flex items-center gap-2 border-b pb-3 mb-4">
              <i class="fas fa-plus-circle text-indigo-600"></i>
              <h2 class="font-bold text-sm text-gray-800">Register New Firm</h2>
            </div>
            <form onsubmit="event.preventDefault(); createFirm();" class="space-y-3">
              <div>
                <label class="text-[10px] font-bold text-gray-500 uppercase block mb-1">Firm Name</label>
                <input id="newFirmName" placeholder="e.g. GSM Solutions" class="w-full p-2.5 border rounded-xl text-xs bg-gray-50 outline-none focus:bg-white focus:border-indigo-500" required>
              </div>
              <div>
                <label class="text-[10px] font-bold text-gray-500 uppercase block mb-1">Admin Login ID</label>
                <input id="newAdminEmail" placeholder="admin_identifier" class="w-full p-2.5 border rounded-xl text-xs bg-gray-50 outline-none focus:bg-white focus:border-indigo-500" required>
              </div>
              <div>
                <label class="text-[10px] font-bold text-gray-500 uppercase block mb-1">Assigned Password</label>
                <input id="newAdminPassword" placeholder="default login password" class="w-full p-2.5 border rounded-xl text-xs bg-gray-50 outline-none focus:bg-white focus:border-indigo-500" required>
              </div>
              <div>
                <label class="text-[10px] font-bold text-gray-500 uppercase block mb-1">Employee Capacity</label>
                <input type="number" id="newAdminLimit" placeholder="10" value="10" class="w-full p-2.5 border rounded-xl text-xs bg-gray-50 outline-none focus:bg-white focus:border-indigo-500" required>
              </div>
              <button type="submit" id="btnCreate" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-xl font-bold text-xs shadow-md transition active:scale-95 flex items-center justify-center gap-1.5 mt-2">
                <i class="fas fa-check"></i> Create Firm Admin
              </button>
            </form>
          </div>

          <!-- STATS -->
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 mt-4">
            <h3 class="font-bold text-xs text-gray-700 uppercase tracking-wider mb-3"><i class="fas fa-chart-bar text-indigo-500"></i> Quick Stats</h3>
            <div class="grid grid-cols-2 gap-2">
              <div class="bg-indigo-50 p-3 rounded-xl text-center">
                <p id="statTotal" class="text-xl font-black text-indigo-700">0</p>
                <p class="text-[9px] text-gray-500 uppercase font-bold">Total Firms</p>
              </div>
              <div class="bg-green-50 p-3 rounded-xl text-center">
                <p id="statActive" class="text-xl font-black text-green-700">0</p>
                <p class="text-[9px] text-gray-500 uppercase font-bold">Active Plans</p>
              </div>
              <div class="bg-orange-50 p-3 rounded-xl text-center">
                <p id="statTrial" class="text-xl font-black text-orange-700">0</p>
                <p class="text-[9px] text-gray-500 uppercase font-bold">On Trial</p>
              </div>
              <div class="bg-red-50 p-3 rounded-xl text-center">
                <p id="statExpired" class="text-xl font-black text-red-700">0</p>
                <p class="text-[9px] text-gray-500 uppercase font-bold">Expired</p>
              </div>
            </div>
          </div>
        </div>

        <!-- FIRMS LIST -->
        <div class="w-full lg:flex-1">
          <div class="flex justify-between items-center mb-3">
            <h2 class="font-bold text-sm text-gray-700 uppercase tracking-wider">Active Firms</h2>
            <span id="mobileCountBadge" class="lg:hidden text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">0</span>
          </div>
          <div id="firmList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 pb-8"></div>
        </div>

      </div>
    </main>
  </div>

  <!-- EDIT FIRM MODAL -->
  <div id="editModal" class="hidden absolute inset-0 bg-black bg-opacity-60 z-[60] flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h3 class="font-bold text-lg text-gray-800"><i class="fas fa-edit text-indigo-500"></i> Edit Firm</h3>
        <button onclick="closeEditModal()" class="text-gray-400"><i class="fas fa-times text-lg"></i></button>
      </div>

      <input type="hidden" id="editId">

      <div class="space-y-3">
        <div>
          <label class="text-[10px] font-bold text-gray-500 uppercase block mb-1">Firm Name</label>
          <input id="editFirmName" class="w-full p-2.5 border rounded-xl text-sm bg-gray-50 outline-none focus:bg-white focus:border-indigo-500">
        </div>
        <div>
          <label class="text-[10px] font-bold text-gray-500 uppercase block mb-1">Login ID</label>
          <input id="editEmail" class="w-full p-2.5 border rounded-xl text-sm bg-gray-50 outline-none focus:bg-white focus:border-indigo-500">
        </div>
        <div>
          <label class="text-[10px] font-bold text-gray-500 uppercase block mb-1">Password</label>
          <input id="editPassword" class="w-full p-2.5 border rounded-xl text-sm bg-gray-50 outline-none focus:bg-white focus:border-indigo-500">
        </div>
        <div>
          <label class="text-[10px] font-bold text-gray-500 uppercase block mb-1">Employee Limit</label>
          <input type="number" id="editLimit" class="w-full p-2.5 border rounded-xl text-sm bg-gray-50 outline-none focus:bg-white focus:border-indigo-500">
        </div>

        <!-- Subscription control -->
        <div class="border-t pt-3 mt-3">
          <h4 class="font-bold text-xs text-gray-700 uppercase tracking-wider mb-2"><i class="fas fa-crown text-yellow-500"></i> Subscription Control</h4>
          <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-3 space-y-2">
            <div>
              <label class="text-[10px] font-bold text-gray-600 uppercase block mb-1">Status</label>
              <select id="editSubStatus" class="w-full p-2 border rounded-lg text-sm bg-white">
                <option value="trial">Trial</option>
                <option value="active">Active (Paid)</option>
                <option value="expired">Expired</option>
                <option value="pending_payment">Pending Payment</option>
              </select>
            </div>
            <div>
              <label class="text-[10px] font-bold text-gray-600 uppercase block mb-1">Plan</label>
              <select id="editSubPlan" class="w-full p-2 border rounded-lg text-sm bg-white">
                <option value="">— none —</option>
                <option value="monthly">Monthly</option>
                <option value="yearly">Yearly</option>
                <option value="enterprise">Enterprise</option>
              </select>
            </div>
            <div>
              <label class="text-[10px] font-bold text-gray-600 uppercase block mb-1">Expires At</label>
              <input type="date" id="editSubExpires" class="w-full p-2 border rounded-lg text-sm bg-white">
            </div>
            <div class="grid grid-cols-3 gap-1 mt-2">
              <button type="button" onclick="quickExtend(30)" class="bg-blue-100 hover:bg-blue-200 text-blue-700 py-1.5 rounded-lg text-[10px] font-bold">+30d</button>
              <button type="button" onclick="quickExtend(365)" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 py-1.5 rounded-lg text-[10px] font-bold">+365d</button>
              <button type="button" onclick="quickExtend(0)" class="bg-red-100 hover:bg-red-200 text-red-700 py-1.5 rounded-lg text-[10px] font-bold">Expire</button>
            </div>
          </div>
        </div>
      </div>

      <div class="flex gap-2 pt-4 mt-3 border-t">
        <button onclick="closeEditModal()" class="flex-1 bg-gray-200 py-2.5 rounded-xl font-bold text-sm">Cancel</button>
        <button onclick="updateFirm()" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl font-bold text-sm shadow-md active:scale-95">Save</button>
      </div>
    </div>
  </div>

</div>

<script>
let allFirms = [];
let currentSuperadmin = null;

// ============== API ==============
async function api(path, opts = {}) {
  const res = await fetch(path, {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// ============== SESSION ==============
(async () => {
  try {
    const res = await fetch('/api/auth/me', { credentials: 'include' });
    if (res.status === 401) return;
    const me = await res.json();
    if (me.role === 'superadmin') {
      currentSuperadmin = me;
      activateDashboard();
    }
  } catch (e) {}
})();

async function superadminLogin() {
  const email = document.getElementById('saEmail').value.trim();
  const password = document.getElementById('saPassword').value.trim();
  const errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');
  const btn = document.getElementById('btnLogin');
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
  btn.disabled = true;
  try {
    const r = await api('/api/auth/superadmin-login', { method: 'POST', body: { email, password } });
    currentSuperadmin = r;
    activateDashboard();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
  } finally {
    btn.innerHTML = '<span>Access Console</span><i class="fas fa-arrow-right text-xs"></i>';
    btn.disabled = false;
  }
}

function activateDashboard() {
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('dashboardView').classList.remove('hidden');
  document.getElementById('dashboardView').classList.add('flex');
  document.getElementById('saUserLabel').innerText = currentSuperadmin.email || 'Superadmin';
  loadFirms();
}

async function logout() {
  try { await api('/api/auth/superadmin-logout', { method: 'POST' }); } catch (e) {}
  location.reload();
}

// ============== FIRMS ==============
async function loadFirms() {
  const icon = document.getElementById('refreshIcon');
  if (icon) icon.classList.add('fa-spin');
  try {
    const r = await api('/api/superadmin/firms');
    allFirms = r.firms || [];
    renderFirms();
    updateStats();
  } catch (e) {
    alert('Failed to load firms: ' + e.message);
  } finally {
    if (icon) icon.classList.remove('fa-spin');
  }
}

function updateStats() {
  document.getElementById('statTotal').innerText = allFirms.length;
  document.getElementById('statActive').innerText = allFirms.filter(f => f.subscription?.state === 'active').length;
  document.getElementById('statTrial').innerText = allFirms.filter(f => f.subscription?.state === 'trial').length;
  document.getElementById('statExpired').innerText = allFirms.filter(f => f.subscription?.state === 'expired' || f.subscription?.state === 'pending_payment').length;
  document.getElementById('firmCountBadge').innerText = allFirms.length + ' Firms';
  document.getElementById('mobileCountBadge').innerText = allFirms.length + ' firms';
}

function renderFirms() {
  const list = document.getElementById('firmList');
  if (!allFirms.length) {
    list.innerHTML = '<div class="col-span-full p-8 text-center text-gray-400 bg-white rounded-xl border border-gray-200 text-xs">No firms yet. Create one →</div>';
    return;
  }

  list.innerHTML = allFirms.map(f => {
    const sub = f.subscription || {};
    let badgeCls = 'bg-gray-100 text-gray-700';
    let badgeText = 'Unknown';
    if (sub.state === 'active') { badgeCls = 'bg-green-100 text-green-700'; badgeText = `Active • ${sub.daysLeft}d`; }
    else if (sub.state === 'trial') { badgeCls = 'bg-orange-100 text-orange-700'; badgeText = `Trial • ${sub.daysLeft}d`; }
    else if (sub.state === 'expired') { badgeCls = 'bg-red-100 text-red-700'; badgeText = 'Expired'; }
    else if (sub.state === 'pending_payment') { badgeCls = 'bg-yellow-100 text-yellow-700'; badgeText = 'Pending Payment'; }

    return `
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 hover:border-indigo-300 transition">
        <div class="flex items-start justify-between gap-2 mb-3">
          <h3 class="font-bold text-indigo-700 text-sm leading-tight truncate flex-1">${f.firm_name || 'Unnamed Firm'}</h3>
          <span class="text-[9px] font-bold px-2 py-1 rounded-full whitespace-nowrap ${badgeCls}">${badgeText}</span>
        </div>

        <div class="space-y-1 text-[11px] text-gray-600 bg-gray-50 p-3 rounded-lg border border-gray-100 font-mono mb-3">
          <p class="flex justify-between"><span class="text-gray-400 font-sans">Login:</span> <span class="font-bold text-gray-800 truncate ml-2">${f.email}</span></p>
          <p class="flex justify-between"><span class="text-gray-400 font-sans">Password:</span> <span class="text-indigo-600">${f.password}</span></p>
          <p class="flex justify-between"><span class="text-gray-400 font-sans">Capacity:</span> <span class="font-bold text-emerald-600">${f.employee_limit || 10} emp</span></p>
          ${sub.plan ? `<p class="flex justify-between"><span class="text-gray-400 font-sans">Plan:</span> <span class="font-bold capitalize">${sub.plan}</span></p>` : ''}
        </div>

        <div class="flex gap-2">
          <button onclick="openEdit('${f.id}')" class="flex-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 py-2 rounded-lg text-[10px] font-bold"><i class="fas fa-edit"></i> Edit</button>
          <button onclick="deleteFirm('${f.id}', '${(f.firm_name||'').replace(/'/g,"\\'")}')" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-2 rounded-lg text-[10px] font-bold"><i class="fas fa-trash"></i></button>
        </div>
      </div>`;
  }).join('');
}

async function createFirm() {
  const firm_name = document.getElementById('newFirmName').value.trim();
  const email = document.getElementById('newAdminEmail').value.trim();
  const password = document.getElementById('newAdminPassword').value.trim();
  const employee_limit = parseInt(document.getElementById('newAdminLimit').value) || 10;
  if (!firm_name || !email || !password) return alert('All fields required');

  const btn = document.getElementById('btnCreate');
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';
  btn.disabled = true;
  try {
    await api('/api/superadmin/firms', { method: 'POST', body: { firm_name, email, password, employee_limit } });
    alert('Firm created successfully!');
    document.getElementById('newFirmName').value = '';
    document.getElementById('newAdminEmail').value = '';
    document.getElementById('newAdminPassword').value = '';
    document.getElementById('newAdminLimit').value = '10';
    loadFirms();
  } catch (e) {
    alert('Failed: ' + e.message);
  } finally {
    btn.innerHTML = '<i class="fas fa-check"></i> Create Firm Admin';
    btn.disabled = false;
  }
}

function openEdit(id) {
  const f = allFirms.find(x => x.id === id);
  if (!f) return;
  document.getElementById('editId').value = f.id;
  document.getElementById('editFirmName').value = f.firm_name || '';
  document.getElementById('editEmail').value = f.email || '';
  document.getElementById('editPassword').value = f.password || '';
  document.getElementById('editLimit').value = f.employee_limit || 10;
  document.getElementById('editSubStatus').value = f.subscription_status || 'trial';
  document.getElementById('editSubPlan').value = f.subscription_plan || '';
  const exp = f.subscription_expires_at ? f.subscription_expires_at.split('T')[0] : '';
  document.getElementById('editSubExpires').value = exp;
  document.getElementById('editModal').classList.remove('hidden');
}

function closeEditModal() {
  document.getElementById('editModal').classList.add('hidden');
}

function quickExtend(days) {
  const statusEl = document.getElementById('editSubStatus');
  const planEl = document.getElementById('editSubPlan');
  const expEl = document.getElementById('editSubExpires');
  if (days === 0) {
    statusEl.value = 'expired';
    expEl.value = new Date().toISOString().split('T')[0];
    return;
  }
  const newDate = new Date();
  newDate.setDate(newDate.getDate() + days);
  statusEl.value = 'active';
  if (!planEl.value) planEl.value = days === 30 ? 'monthly' : 'yearly';
  expEl.value = newDate.toISOString().split('T')[0];
}

async function updateFirm() {
  const id = document.getElementById('editId').value;
  const payload = {
    id,
    firm_name: document.getElementById('editFirmName').value.trim(),
    email: document.getElementById('editEmail').value.trim(),
    password: document.getElementById('editPassword').value.trim(),
    employee_limit: parseInt(document.getElementById('editLimit').value) || 10,
    subscription_status: document.getElementById('editSubStatus').value,
    subscription_plan: document.getElementById('editSubPlan').value || null
  };

  const expDate = document.getElementById('editSubExpires').value;
  if (expDate) payload.subscription_expires_at = new Date(expDate + 'T23:59:59').toISOString();

  try {
    await api('/api/superadmin/firms', { method: 'PATCH', body: payload });
    alert('Firm updated');
    closeEditModal();
    loadFirms();
  } catch (e) {
    alert('Failed: ' + e.message);
  }
}

async function deleteFirm(id, name) {
  if (!confirm(`Delete "${name}"? This removes all employees and attendance.`)) return;
  try {
    await api('/api/superadmin/firms', { method: 'DELETE', body: { id } });
    alert('Firm deleted');
    loadFirms();
  } catch (e) {
    alert('Failed: ' + e.message);
  }
}
</script>
